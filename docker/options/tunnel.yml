# Cloudflare Tunnel — optional public ingress without opening a port.
#
# Enable by uncommenting this file's include line in docker-compose.yml, and
# set CLOUDFLARE_TUNNEL_TOKEN in .env (Zero Trust dashboard -> Networks ->
# Tunnels -> Create a tunnel -> Cloudflared connector).
#
# Hostname -> service routing is configured in the dashboard, not here: in the
# tunnel's Public Hostname tab point the app hostname at http://frontend:3107
# and the API hostname at http://backend:8000. Also switch NEXT_PUBLIC_APP_URL,
# NEXT_PUBLIC_API_URL, BETTER_AUTH_URL and CORS_ORIGINS to those public
# hostnames (see .env.example) or browser sign-in and uploads will fail.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3 # exact tags only upstream; bump periodically
    container_name: supoclip-cloudflared
    # Metrics/debug endpoint binds to loopback only: the healthcheck below execs
    # inside this container, so nothing on the compose network needs to reach it.
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "run"]
    environment:
      # TUNNEL_TOKEN is how cloudflared reads the token from the environment.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
