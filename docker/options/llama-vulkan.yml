# Local LLM: llama.cpp server, any Vulkan-capable GPU.
#
# A convenience scaffold, not a tuned deployment — it starts an
# OpenAI-compatible endpoint next to SupoClip so transcript analysis can run
# without a cloud provider. Expect to tune the flags for your model and card.
#
# Enable by uncommenting EXACTLY ONE llama-*.yml include in docker-compose.yml
# (they all define the same `llama` service), then:
#
#   cp .env.llama.example .env.llama
#
# All five variants share that one file. You must supply the model yourself:
# put a .gguf in the directory LLAMA_MODELS_DIR names (default ./models) and
# point LLAMA_ARG_MODEL at it. Without .env.llama the server has no model to
# load and exits on startup.
#
# The other half of the pairing goes in the root .env, because compose feeds it
# to the backend through `environment:`, which outranks any env_file:
#
#   LLM=openai:local
#   OPENAI_BASE_URL=http://llama:8080/v1
#
# The vendor-neutral fallback: works wherever the host has a Vulkan
# driver, usually slower than the vendor-specific images above.
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: supoclip-llama
    env_file:
      # Resolved relative to THIS file's directory, not the project root.
      #
      # The service is configured entirely through llama-server's own
      # LLAMA_ARG_* variables in that file, and deliberately passes no
      # command-line arguments: a command-line flag beats the matching
      # environment variable, so an argument here would override — and
      # silently ignore — whatever you put in .env.llama.
      - path: ../../.env.llama
        required: false
    ports:
      # Loopback only: SupoClip reaches it over the compose network at
      # http://llama:8080. The published port is for curl and llama.cpp's own
      # web UI, and defaults to 9292 to stay clear of anything on 8080.
      - "127.0.0.1:${LLAMA_PORT:-9292}:8080"
    volumes:
      # Read-only: the server never writes to the model directory. The host
      # path is a stack-level layout choice, so it stays in the root .env —
      # compose can only interpolate from there.
      - ${LLAMA_MODELS_DIR:-./models}:/models:ro
    devices:
      # The GPU render nodes Vulkan drives.
      - /dev/dri:/dev/dri
    restart: unless-stopped
    healthcheck:
      # /health reports 200 only once the model is loaded into memory.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
