# The backend and worker each come in two variants sharing one definition
# (the x-backend-service / x-worker-service anchors below): a default CPU
# variant and a `-vaapi` variant that additionally maps the host GPU render
# nodes (/dev/dri) for VAAPI hardware encoding. The mapping cannot live on the
# default services because a `devices:` entry fails container creation on
# hosts without /dev/dri.
#
# Which variant runs is switched by VAAPI_ENABLED in .env: each variant's
# profile name embeds the flag (cpu-false/cpu-true and vaapi-false/vaapi-true)
# and COMPOSE_PROFILES=cpu-false,vaapi-true activates whichever pair matches,
# so VAAPI_ENABLED=false starts backend+worker and VAAPI_ENABLED=true starts
# backend-vaapi+worker-vaapi. Set VIDEO_ENCODER=vaapi alongside it so ffmpeg
# actually uses the GPU. The config-guard service below fails the stack loudly
# when the switch is misconfigured (otherwise no variant would be selected and
# the stack would come up with no API at all).
#
# When flipping VAAPI_ENABLED on an already-running stack, recreate it with
#   docker compose down --remove-orphans && docker compose up -d
# — a plain `up -d` hits a container-name conflict because the previous
# variant's containers (same container_name/ports) are left behind as orphans.

x-backend-service: &backend-service
  build:
    context: ./backend
    # Resolved relative to the build context, hence the leading `../`.
    dockerfile: ../docker/backend.Dockerfile
  container_name: supoclip-backend
  platform: linux/amd64
  command: [".venv/bin/uvicorn", "src.main_refactored:app", "--host", "0.0.0.0", "--port", "8000"]
  ports:
    - "127.0.0.1:8000:8000"
  volumes:
    - ./backend/src:/app/src
    - uploads:/app/uploads
    - clips:/app/clips
    - ./backend/fonts:/app/fonts
    - ./backend/transitions:/app/transitions
  environment:
    - PYTHONPATH=/app
    - PYTHONUNBUFFERED=1
    - DATABASE_URL=postgresql+asyncpg://supoclip:supoclip_password@postgres:5432/supoclip
    - TEMP_DIR=/app/uploads
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY}
    - ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS=${ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS:-900}
    - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-assemblyai}
    - WHISPERX_MODEL=${WHISPERX_MODEL:-large-v3}
    - WHISPERX_DEVICE=${WHISPERX_DEVICE:-auto}
    - WHISPERX_COMPUTE_TYPE=${WHISPERX_COMPUTE_TYPE:-}
    - WHISPERX_DIARIZE=${WHISPERX_DIARIZE:-true}
    - HF_TOKEN=${HF_TOKEN:-}
    - APIFY_API_TOKEN=${APIFY_API_TOKEN}
    - APIFY_YOUTUBE_DOWNLOADER_ACTOR=${APIFY_YOUTUBE_DOWNLOADER_ACTOR:-epctex/youtube-video-downloader}
    - APIFY_YOUTUBE_DEFAULT_QUALITY=${APIFY_YOUTUBE_DEFAULT_QUALITY:-1080}
    - APIFY_RUN_TIMEOUT_SECONDS=${APIFY_RUN_TIMEOUT_SECONDS:-900}
    - YOUTUBE_DATA_API_KEY=${YOUTUBE_DATA_API_KEY}
    - YOUTUBE_METADATA_PROVIDER=${YOUTUBE_METADATA_PROVIDER:-yt_dlp}
    - YOUTUBE_DOWNLOAD_PROVIDER=${YOUTUBE_DOWNLOAD_PROVIDER:-yt_dlp}
    - LLM=${LLM:-}
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    - OPENAI_SERVICE_TIER=${OPENAI_SERVICE_TIER:-}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    # Deprecated aliases of OPENAI_BASE_URL/OPENAI_API_KEY for LLM=ollama:*
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
    - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
    - QUEUED_TASK_TIMEOUT_SECONDS=${QUEUED_TASK_TIMEOUT_SECONDS:-180}
    # Concurrent worker jobs; lower when local GPU transcription/encoding
    # shares one card with the jobs.
    - WORKER_MAX_JOBS=${WORKER_MAX_JOBS:-4}
    - DEFAULT_PROCESSING_MODE=${DEFAULT_PROCESSING_MODE:-fast}
    - FAST_MODE_MAX_CLIPS=${FAST_MODE_MAX_CLIPS:-4}
    - FAST_MODE_TRANSCRIPT_MODEL=${FAST_MODE_TRANSCRIPT_MODEL:-universal}
    # VAAPI hardware encoding also needs the host GPU render nodes, mapped by
    # the -vaapi service variants — set VAAPI_ENABLED=true in .env (see the
    # note at the top of this file).
    - VIDEO_ENCODER=${VIDEO_ENCODER:-libx264}
    - VAAPI_DEVICE=${VAAPI_DEVICE:-/dev/dri/renderD128}
    - SELF_HOST=${SELF_HOST:-true}
    - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
    - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
    - AUTH_SIGNATURE_TTL_SECONDS=${AUTH_SIGNATURE_TTL_SECONDS:-300}
    - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001,http://localhost:3107,http://sp.localhost:3107,http://supoclip.localhost:3107}
    - FREE_PLAN_TASK_LIMIT=${FREE_PLAN_TASK_LIMIT:-10}
    - PRO_PLAN_TASK_LIMIT=${PRO_PLAN_TASK_LIMIT:-50}
    - SCALE_PLAN_TASK_LIMIT=${SCALE_PLAN_TASK_LIMIT:-300}
    - AWS_REGION=${AWS_REGION}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    - "SES_FROM_EMAIL=${SES_FROM_EMAIL:-SupoClip <onboarding@example.com>}"
    - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    - DISCORD_FEEDBACK_WEBHOOK_URL=${DISCORD_FEEDBACK_WEBHOOK_URL}
    - DISCORD_SALES_WEBHOOK_URL=${DISCORD_SALES_WEBHOOK_URL}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

# Worker process for background video processing. depends_on is set per
# variant below because each worker waits on its matching backend variant.
x-worker-service: &worker-service
  build:
    context: ./backend
    # Resolved relative to the build context, hence the leading `../`.
    dockerfile: ../docker/backend.Dockerfile
  container_name: supoclip-worker
  platform: linux/amd64
  command: [".venv/bin/arq", "src.workers.tasks.WorkerSettings"]
  volumes:
    - ./backend/src:/app/src
    - uploads:/app/uploads
    - clips:/app/clips
    - ./backend/fonts:/app/fonts
    - ./backend/transitions:/app/transitions
  environment:
    - PYTHONPATH=/app
    - PYTHONUNBUFFERED=1
    - DATABASE_URL=postgresql+asyncpg://supoclip:supoclip_password@postgres:5432/supoclip
    - TEMP_DIR=/app/uploads
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY}
    - ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS=${ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS:-900}
    - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-assemblyai}
    - WHISPERX_MODEL=${WHISPERX_MODEL:-large-v3}
    - WHISPERX_DEVICE=${WHISPERX_DEVICE:-auto}
    - WHISPERX_COMPUTE_TYPE=${WHISPERX_COMPUTE_TYPE:-}
    - WHISPERX_DIARIZE=${WHISPERX_DIARIZE:-true}
    - HF_TOKEN=${HF_TOKEN:-}
    - APIFY_API_TOKEN=${APIFY_API_TOKEN}
    - APIFY_YOUTUBE_DOWNLOADER_ACTOR=${APIFY_YOUTUBE_DOWNLOADER_ACTOR:-epctex/youtube-video-downloader}
    - APIFY_YOUTUBE_DEFAULT_QUALITY=${APIFY_YOUTUBE_DEFAULT_QUALITY:-1080}
    - APIFY_RUN_TIMEOUT_SECONDS=${APIFY_RUN_TIMEOUT_SECONDS:-900}
    - YOUTUBE_DATA_API_KEY=${YOUTUBE_DATA_API_KEY}
    - YOUTUBE_METADATA_PROVIDER=${YOUTUBE_METADATA_PROVIDER:-yt_dlp}
    - YOUTUBE_DOWNLOAD_PROVIDER=${YOUTUBE_DOWNLOAD_PROVIDER:-yt_dlp}
    - LLM=${LLM:-}
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    - OPENAI_SERVICE_TIER=${OPENAI_SERVICE_TIER:-}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    # Deprecated aliases of OPENAI_BASE_URL/OPENAI_API_KEY for LLM=ollama:*
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
    - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
    - QUEUED_TASK_TIMEOUT_SECONDS=${QUEUED_TASK_TIMEOUT_SECONDS:-180}
    # Concurrent worker jobs; lower when local GPU transcription/encoding
    # shares one card with the jobs.
    - WORKER_MAX_JOBS=${WORKER_MAX_JOBS:-4}
    - DEFAULT_PROCESSING_MODE=${DEFAULT_PROCESSING_MODE:-fast}
    - FAST_MODE_MAX_CLIPS=${FAST_MODE_MAX_CLIPS:-4}
    - FAST_MODE_TRANSCRIPT_MODEL=${FAST_MODE_TRANSCRIPT_MODEL:-universal}
    # VAAPI hardware encoding also needs the host GPU render nodes, mapped by
    # the -vaapi service variants — set VAAPI_ENABLED=true in .env (see the
    # note at the top of this file).
    - VIDEO_ENCODER=${VIDEO_ENCODER:-libx264}
    - VAAPI_DEVICE=${VAAPI_DEVICE:-/dev/dri/renderD128}
    - SELF_HOST=${SELF_HOST:-true}
    - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
    - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
    - AUTH_SIGNATURE_TTL_SECONDS=${AUTH_SIGNATURE_TTL_SECONDS:-300}
    - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001,http://localhost:3107,http://sp.localhost:3107,http://supoclip.localhost:3107}
    - FREE_PLAN_TASK_LIMIT=${FREE_PLAN_TASK_LIMIT:-10}
    - PRO_PLAN_TASK_LIMIT=${PRO_PLAN_TASK_LIMIT:-50}
    - SCALE_PLAN_TASK_LIMIT=${SCALE_PLAN_TASK_LIMIT:-300}
    - AWS_REGION=${AWS_REGION}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    - "SES_FROM_EMAIL=${SES_FROM_EMAIL:-SupoClip <onboarding@example.com>}"
    - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # One-shot validator for the VAAPI switch: frontend and mcp wait for it to
  # exit successfully. Without this, a typo in VAAPI_ENABLED (anything other
  # than true/false) or a missing/stale COMPOSE_PROFILES line in .env would
  # deselect every backend/worker variant and `up` would silently come up
  # with no API. Note: this reads COMPOSE_PROFILES from the environment/.env —
  # activating profiles via the `--profile` CLI flag instead is unsupported.
  config-guard:
    image: busybox:1.37
    container_name: supoclip-config-guard
    restart: "no"
    environment:
      - VAAPI_ENABLED=${VAAPI_ENABLED:-false}
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-}
    command:
      - sh
      - -c
      - |
        case "$$VAAPI_ENABLED" in
          true)  needed=vaapi-true;  forbidden=cpu-true ;;
          false) needed=cpu-false;   forbidden=vaapi-false ;;
          *)
            echo "config-guard: VAAPI_ENABLED must be 'true' or 'false', got '$$VAAPI_ENABLED' — no backend/worker variant is selected." >&2
            exit 1 ;;
        esac
        case ",$$COMPOSE_PROFILES," in
          *",$$forbidden,"*)
            echo "config-guard: COMPOSE_PROFILES ('$$COMPOSE_PROFILES') activates both backend/worker variants, which collide on container names and ports — use COMPOSE_PROFILES=cpu-false,vaapi-true (see .env.example)." >&2
            exit 1 ;;
        esac
        case ",$$COMPOSE_PROFILES," in
          *",$$needed,"*) exit 0 ;;
        esac
        echo "config-guard: COMPOSE_PROFILES ('$$COMPOSE_PROFILES') does not activate the '$$needed' profile — add COMPOSE_PROFILES=cpu-false,vaapi-true to .env (see .env.example)." >&2
        exit 1

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: ${FRONTEND_BUILD_TARGET:-development}
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
        - NEXT_PUBLIC_SELF_HOST=${SELF_HOST:-true}
        - NEXT_PUBLIC_PRO_PRICE_MONTHLY=${NEXT_PUBLIC_PRO_PRICE_MONTHLY:-10}
        - NEXT_PUBLIC_SCALE_PRICE_MONTHLY=${NEXT_PUBLIC_SCALE_PRICE_MONTHLY:-50}
        - NEXT_PUBLIC_FREE_PLAN_TASK_LIMIT=${NEXT_PUBLIC_FREE_PLAN_TASK_LIMIT:-10}
        - NEXT_PUBLIC_PRO_PLAN_TASK_LIMIT=${NEXT_PUBLIC_PRO_PLAN_TASK_LIMIT:-50}
        - NEXT_PUBLIC_SCALE_PLAN_TASK_LIMIT=${NEXT_PUBLIC_SCALE_PLAN_TASK_LIMIT:-300}
        - NEXT_PUBLIC_DATAFAST_WEBSITE_ID=${NEXT_PUBLIC_DATAFAST_WEBSITE_ID:-}
        - NEXT_PUBLIC_DATAFAST_DOMAIN=${NEXT_PUBLIC_DATAFAST_DOMAIN:-}
        - NEXT_PUBLIC_DATAFAST_ALLOW_LOCALHOST=${NEXT_PUBLIC_DATAFAST_ALLOW_LOCALHOST:-false}
    container_name: supoclip-frontend
    ports:
      - "127.0.0.1:3001:3107"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/prisma:/app/prisma
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_SELF_HOST=${SELF_HOST:-true}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      - NEXT_PUBLIC_LANDING_ONLY_MODE=${NEXT_PUBLIC_LANDING_ONLY_MODE:-false}
      # Sign-ups are closed unless explicitly opened, so a publicly exposed
      # deployment does not accept strangers by default.
      - DISABLE_SIGN_UP=${DISABLE_SIGN_UP:-true}
      - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
      - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://supoclip:supoclip_password@postgres:5432/supoclip
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-supoclip_dev_secret_change_in_production}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3001}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID}
      - STRIPE_SCALE_PRICE_ID=${STRIPE_SCALE_PRICE_ID}
      - NEXT_PUBLIC_PRO_PRICE_MONTHLY=${NEXT_PUBLIC_PRO_PRICE_MONTHLY:-10}
      - NEXT_PUBLIC_SCALE_PRICE_MONTHLY=${NEXT_PUBLIC_SCALE_PRICE_MONTHLY:-50}
      - NEXT_PUBLIC_FREE_PLAN_TASK_LIMIT=${NEXT_PUBLIC_FREE_PLAN_TASK_LIMIT:-10}
      - NEXT_PUBLIC_PRO_PLAN_TASK_LIMIT=${NEXT_PUBLIC_PRO_PLAN_TASK_LIMIT:-50}
      - NEXT_PUBLIC_SCALE_PLAN_TASK_LIMIT=${NEXT_PUBLIC_SCALE_PLAN_TASK_LIMIT:-300}
      - NEXT_PUBLIC_DATAFAST_WEBSITE_ID=${NEXT_PUBLIC_DATAFAST_WEBSITE_ID:-}
      - NEXT_PUBLIC_DATAFAST_DOMAIN=${NEXT_PUBLIC_DATAFAST_DOMAIN:-}
      - NEXT_PUBLIC_DATAFAST_ALLOW_LOCALHOST=${NEXT_PUBLIC_DATAFAST_ALLOW_LOCALHOST:-false}
      - STRIPE_CHECKOUT_URL=${STRIPE_CHECKOUT_URL}
      - STRIPE_CUSTOMER_PORTAL_URL=${STRIPE_CUSTOMER_PORTAL_URL}
      - REVENUECAT_WEBHOOK_AUTH_HEADER=${REVENUECAT_WEBHOOK_AUTH_HEADER}
      - REVENUECAT_PRO_PRODUCT_IDS=${REVENUECAT_PRO_PRODUCT_IDS}
      - REVENUECAT_SCALE_PRODUCT_IDS=${REVENUECAT_SCALE_PRODUCT_IDS}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - "SES_FROM_EMAIL=${SES_FROM_EMAIL:-SupoClip <onboarding@example.com>}"
    depends_on:
      config-guard:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # Only one backend variant is active at a time (see the profiles note at
      # the top of the file); required: false skips the inactive one.
      backend:
        condition: service_healthy
        required: false
      backend-vaapi:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      # Exercise Better Auth and Prisma, not only the static landing page.
      test: ["CMD", "curl", "-f", "http://localhost:3107/api/auth/get-session"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    <<: *backend-service
    profiles: ["cpu-${VAAPI_ENABLED:-false}"]

  backend-vaapi:
    <<: *backend-service
    profiles: ["vaapi-${VAAPI_ENABLED:-false}"]
    networks:
      # frontend and mcp reach the API at http://backend:8000, so this
      # variant must answer to the same hostname.
      default:
        aliases:
          - backend
    devices:
      # With more than one GPU, point VAAPI_DEVICE at the right render node
      # (default /dev/dri/renderD128): `ls -l /dev/dri/by-path` shows which
      # PCI device backs each node, or probe them with
      # `vainfo --display drm --device /dev/dri/renderD129`.
      - /dev/dri:/dev/dri

  worker:
    <<: *worker-service
    profiles: ["cpu-${VAAPI_ENABLED:-false}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  worker-vaapi:
    <<: *worker-service
    profiles: ["vaapi-${VAAPI_ENABLED:-false}"]
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-vaapi:
        condition: service_healthy

  mcp:
    build:
      context: ./mcp
      dockerfile: ../docker/mcp.Dockerfile
    container_name: supoclip-mcp
    ports:
      - "127.0.0.1:${SUPOCLIP_MCP_PORT:-9100}:9100"
    volumes:
      - mcp_downloads:/app/supoclip-downloads
    environment:
      - SUPOCLIP_API_URL=${SUPOCLIP_API_URL:-http://backend:8000}
      - SUPOCLIP_DOWNLOAD_DIR=/app/supoclip-downloads
      - SUPOCLIP_TIMEOUT=${SUPOCLIP_TIMEOUT:-60}
      - SUPOCLIP_MCP_TRANSPORT=${SUPOCLIP_MCP_TRANSPORT:-sse}
      - SUPOCLIP_MCP_HOST=0.0.0.0
      - SUPOCLIP_MCP_PORT=9100
      - SUPOCLIP_MCP_PUBLIC_URL=${SUPOCLIP_MCP_PUBLIC_URL:-https://mcp.supoclip.com}
      - SUPOCLIP_MCP_REQUIRE_BEARER_AUTH=${SUPOCLIP_MCP_REQUIRE_BEARER_AUTH:-true}
    restart: unless-stopped
    depends_on:
      config-guard:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
        required: false
      backend-vaapi:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9100), 5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Redis for caching and job queues (useful for video processing)
  redis:
    image: redis:7-alpine
    container_name: supoclip-redis
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command:
      [
        "sh",
        "-c",
        "if [ -n \"$${REDIS_PASSWORD}\" ]; then exec docker-entrypoint.sh redis-server --requirepass \"$${REDIS_PASSWORD}\"; fi; exec docker-entrypoint.sh redis-server",
      ]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database for storing video metadata, user data, etc.
  postgres:
    image: postgres:15-alpine
    container_name: supoclip-postgres
    environment:
      POSTGRES_DB: supoclip
      POSTGRES_USER: supoclip
      POSTGRES_PASSWORD: supoclip_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supoclip -d supoclip"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cloudflare Tunnel for optional public ingress. Opt-in via the "tunnel"
  # profile (start.sh enables it automatically when CLOUDFLARE_TUNNEL_TOKEN
  # is set in .env): docker compose --profile tunnel up -d
  # Hostname -> service routing is configured in the Cloudflare Zero Trust
  # dashboard: point the app hostname at http://frontend:3107 and the API
  # hostname at http://backend:8000.
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3 # exact tags only upstream; bump periodically
    container_name: supoclip-cloudflared
    profiles: ["tunnel"]
    # Metrics/debug endpoint binds to loopback only: the healthcheck below execs
    # inside this container, so nothing on the compose network needs to reach it.
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "run"]
    environment:
      # TUNNEL_TOKEN is how cloudflared reads the token from the environment.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  uploads:
    driver: local
  clips:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  mcp_downloads:
    driver: local

networks:
  default:
    name: supoclip-network
