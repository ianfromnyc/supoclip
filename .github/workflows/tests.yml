name: Tests

on:
  # `edited` is not in the default activity set (opened, synchronize,
  # reopened), so a pull request that changed its base branch kept showing the
  # result from the old base and never ran against the new one.
  #
  # Title and body edits raise `edited` too. The guard on each job below skips
  # the test jobs for those. It cannot stop the run itself: a job-level `if` is
  # evaluated after Actions creates the run, so the run still appears and
  # reports its jobs as skipped.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main
      - master
  # Lets a maintainer start a run by hand when a branch needs one.
  workflow_dispatch:

jobs:
  backend:
    # Skip when a pull request edit left the base branch alone.
    if: >-
      github.event_name != 'pull_request'
      || github.event.action != 'edited'
      || github.event.changes.base != null
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: supoclip
          POSTGRES_USER: supoclip
          POSTGRES_PASSWORD: supoclip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supoclip -d supoclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      TEST_DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Install backend dependencies
        run: cd backend && uv sync --all-groups
      - name: Run backend tests
        run: cd backend && .venv/bin/pytest

  frontend:
    # Same guard as `backend`. `e2e` needs both of these jobs, so a skip here
    # skips it too and no third copy of the condition is necessary.
    # Skip when a pull request edit left the base branch alone.
    if: >-
      github.event_name != 'pull_request'
      || github.event.action != 'edited'
      || github.event.changes.base != null
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
      BETTER_AUTH_SECRET: supoclip_better_auth_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: cd frontend && npm install
      - name: Run frontend unit tests
        run: cd frontend && npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: supoclip
          POSTGRES_USER: supoclip
          POSTGRES_PASSWORD: supoclip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supoclip -d supoclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      TEST_DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
      BETTER_AUTH_SECRET: supoclip_better_auth_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: cd backend && uv sync --all-groups
      - name: Install frontend dependencies
        run: cd frontend && npm install
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps
      - name: Run Playwright smoke tests
        run: cd frontend && npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
