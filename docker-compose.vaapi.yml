# Optional override that grants the backend and worker containers access to
# the host GPU render nodes for VAAPI hardware encoding (VIDEO_ENCODER=vaapi).
#
# This lives outside docker-compose.yml because a `devices:` mapping fails
# container creation on hosts that have no /dev/dri. Enable it with:
#
#   docker compose -f docker-compose.yml -f docker-compose.vaapi.yml up -d
#
# With more than one GPU, point VAAPI_DEVICE at the right render node (default
# /dev/dri/renderD128): `ls -l /dev/dri/by-path` shows which PCI device backs
# each node, or probe them with `vainfo --display drm --device /dev/dri/renderD129`.
services:
  backend:
    devices:
      - /dev/dri:/dev/dri
  worker:
    devices:
      - /dev/dri:/dev/dri
