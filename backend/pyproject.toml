[project]
name = "supoclip-backend"
version = "0.1.0"
description = "Python-based backend for SupoClip"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apify-client>=1.8.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic-ai>=1.89.1",
    "setuptools-rust>=1.11.1",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2025.7.21",
    "greenlet>=2.0.0",
    "opencv-python>=4.8.0",
    "srt-equalizer>=0.1.10",
    "assemblyai>=0.35.0",
    "srt>=3.5.3",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "aiofiles>=23.2.0",
    "sse-starlette>=1.6.5",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "requests>=2.32.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
# Local transcription (TRANSCRIPTION_PROVIDER=whisperx). Kept optional because
# whisperx pulls in the torch/CUDA stack, which default builds should not pay for.
whisperx = [
    "whisperx>=3.3.1,<3.4",
    # pyannote-audio 4.x renamed Pipeline.from_pretrained's use_auth_token
    # parameter to token, which breaks whisperx 3.3's diarizer at call time.
    "pyannote-audio<4",
    # torch and torchaudio must stay on the same minor version or torchaudio
    # fails at import with undefined C++ symbols; torchaudio stops at 2.11.
    "torch==2.11.*",
    "torchaudio==2.11.*",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
# Coverage gate spans the whole src/ package (legacy/launcher entry points
# omitted below). Measured baseline at gate widening (2026-07-29): 44.36% with
# 113 passed / 12 skipped. fail-under is set a few points below that as a
# regression floor — it must pass today with margin, not act as a target.
addopts = """
--cov=src
--cov-report=term-missing
--cov-report=html
--cov-fail-under=40
"""

[tool.coverage.run]
omit = [
    # Legacy monolithic entry point, superseded by main_refactored.py.
    "src/main.py",
    # Thin process launcher for the ARQ worker (arq src.workers.tasks.WorkerSettings).
    "src/worker_main.py",
]
