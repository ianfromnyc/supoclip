[project]
name = "supoclip-mcp"
version = "0.1.0"
description = "Model Context Protocol server for SupoClip — turn long videos into viral short clips."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "SupoClip" }]
keywords = ["mcp", "supoclip", "video", "clips", "ai"]
dependencies = [
    # Upper bound on purpose: 2.0 removed `mcp.server.fastmcp`, which crashed
    # the server on start. An unpinned major is what let that reach the image.
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.scripts]
supoclip-mcp = "supoclip_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supoclip_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
